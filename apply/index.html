<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Game Lounge Dinamo — გეიმინგ ადმინისტრატორის ვაკანსია" />
    <title>Game Lounge Dinamo — ვაკანსია</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root { --ink:#f7f9ff; --muted:#a5aec3; --line:rgba(255,255,255,.11); --green:#59f29a; --green2:#21cc73; --violet:#9576ff; --night:#070b14; --panel:rgba(18,25,42,.76); --panel-solid:#121a2b; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; min-width:320px; color:var(--ink); font-family:"Noto Sans Georgian",Inter,sans-serif; background:var(--night); }
      button,input,select { font:inherit; }
      button { cursor:pointer; }
      .app { position:relative; min-height:100vh; overflow:hidden; background:radial-gradient(circle at 11% -2%,rgba(113,80,255,.34),transparent 27rem),radial-gradient(circle at 92% 12%,rgba(49,237,143,.18),transparent 26rem),radial-gradient(circle at 50% 100%,rgba(39,161,255,.13),transparent 32rem),var(--night); }
      .app:before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.34; background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:52px 52px; mask-image:linear-gradient(#000,transparent 80%); }
      .shell { position:relative; max-width:1180px; margin:auto; padding:22px 24px 58px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:54px; }
      .brand { display:flex; align-items:center; gap:11px; font:800 15px/1 Inter,sans-serif; letter-spacing:-.4px; }
      .brand-mark { display:grid; place-items:center; width:39px; height:39px; border-radius:13px; background:#fff; box-shadow:0 10px 28px rgba(0,0,0,.22); }
      .brand-mark svg { width:25px; height:19px; fill:#ef3340; }
      .open-badge { display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid rgba(89,242,154,.26); border-radius:999px; color:#b7ffd3; background:rgba(89,242,154,.08); font:700 11px/1 Inter,sans-serif; letter-spacing:.04em; }
      .pulse { width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 0 0 rgba(89,242,154,.65); animation:pulse 1.9s infinite; }
      .hero { display:grid; grid-template-columns:1.16fr .84fr; gap:34px; align-items:end; margin-bottom:30px; }
      .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:17px; color:#d7d0ff; font:700 12px/1 Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
      .eyebrow:before { content:"";width:28px;height:1px;background:var(--violet); }
      h1 { max-width:720px; margin:0; font:800 clamp(41px,6vw,76px)/.99 "Noto Sans Georgian",sans-serif; letter-spacing:-3px; }
      h1 em { color:var(--green); font-style:normal; }
      .hero-copy { max-width:615px; margin:21px 0 0; color:var(--muted); font-size:16px; line-height:1.75; }
      .hero-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .stat { min-height:116px; padding:20px; border:1px solid var(--line); border-radius:19px; background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035)); backdrop-filter:blur(15px); }
      .stat-icon { display:grid;place-items:center;width:33px;height:33px;margin-bottom:13px;border-radius:10px;background:rgba(255,255,255,.1);font-size:16px; }
      .stat b { display:block;font:800 17px/1.2 Inter,sans-serif;letter-spacing:-.6px; }
      .stat span { display:block;margin-top:5px;color:var(--muted);font-size:11px; }
      .main-grid { display:grid; grid-template-columns:minmax(0,1.06fr) minmax(340px,.94fr); gap:20px; align-items:start; }
      .card { border:1px solid var(--line); border-radius:25px; background:linear-gradient(145deg,rgba(32,42,66,.78),rgba(12,18,31,.83)); box-shadow:0 28px 80px rgba(0,0,0,.2); backdrop-filter:blur(22px); }
      .job-card { overflow:hidden; }
      .job-visual { position:relative; min-height:205px; padding:25px; overflow:hidden; background:linear-gradient(120deg,rgba(118,82,255,.91),rgba(49,39,126,.9) 46%,rgba(19,71,74,.9)); }
      .job-visual:before,.job-visual:after { content:"";position:absolute;border:1px solid rgba(255,255,255,.19);border-radius:50%; }
      .job-visual:before { width:280px;height:280px;right:-95px;top:-105px; }
      .job-visual:after { width:185px;height:185px;right:44px;bottom:-118px; }
      .job-label { position:relative; display:inline-flex;padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.22);font:700 11px/1 Inter,sans-serif;letter-spacing:.08em; }
      .visual-gamepad { position:absolute;right:28px;bottom:17px;color:#c8ffc0;font-size:96px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25));transform:rotate(-10deg); }
      .job-visual h2 { position:relative;max-width:310px;margin:44px 0 0;font-size:26px;letter-spacing:-1px;line-height:1.17; }
      .job-content { padding:27px 26px 29px; }
      .section-title { display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px; }
      .section-title h3 { margin:0;font-size:17px;letter-spacing:-.45px; }
      .section-title button { border:0;color:#befbd4;background:none;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:4px; }
      .detail-list { display:grid;gap:1px; }
      .detail { display:flex;align-items:flex-start;gap:13px;padding:13px 0;border-top:1px solid rgba(255,255,255,.07); }
      .detail i { display:grid;place-items:center;flex:0 0 auto;width:27px;height:27px;border-radius:9px;background:rgba(89,242,154,.1);color:var(--green);font-style:normal;font-size:14px; }
      .detail strong { display:block;font-size:13px;line-height:1.35; }
      .detail span { display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5; }
      .location { margin-top:19px;padding:15px;border:1px solid rgba(149,118,255,.24);border-radius:15px;background:rgba(149,118,255,.08); }
      .location small { color:#cfc5ff;font-weight:700;font-size:11px; }
      .location p { margin:5px 0 0;font-size:13px; }
      .form-card { padding:27px; }
      .form-card h2 { margin:0;font-size:25px;letter-spacing:-1px; }
      .form-card > p { margin:8px 0 25px;color:var(--muted);font-size:13px;line-height:1.6; }
      .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:15px; }
      .field-group { margin-bottom:16px; }
      .field-group.full { grid-column:1 / -1; }
      label.field-label { display:block;margin-bottom:8px;color:#e8ebf5;font-size:12px;font-weight:700; }
      .input, select { width:100%;height:51px;padding:0 14px;outline:none;border:1px solid rgba(255,255,255,.1);border-radius:13px;color:var(--ink);background:rgba(255,255,255,.055);font-size:13px;transition:.2s ease; }
      .input::placeholder { color:#778198; }
      .input:hover,select:hover { border-color:rgba(255,255,255,.22); }
      .input:focus,select:focus { border-color:var(--green);background:rgba(89,242,154,.055);box-shadow:0 0 0 4px rgba(89,242,154,.09); }
      select option { background:#172036; }
      .input.invalid { border-color:#ff7591;box-shadow:0 0 0 4px rgba(255,117,145,.09); }
      .languages { display:grid;grid-template-columns:repeat(3,1fr);gap:8px; }
      .language { position:relative;display:flex;align-items:center;justify-content:center;min-height:45px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#b9c1d0;background:rgba(255,255,255,.035);font-size:12px;font-weight:600;cursor:pointer;transition:.2s; }
      .language input { position:absolute;opacity:0; }
      .language:has(input:checked) { color:#b9ffcf;border-color:rgba(89,242,154,.65);background:rgba(89,242,154,.11); }
      .form-note { display:flex;gap:10px;margin:6px 0 21px;padding:13px;border-radius:13px;background:rgba(255,255,255,.045);color:#aeb6c7;font-size:11px;line-height:1.5; }
      .form-note span { color:var(--green); }
      .submit { width:100%;min-height:57px;border:0;border-radius:15px;color:#062714;background:linear-gradient(135deg,#b4ffca,var(--green) 52%,#2cda81);box-shadow:0 14px 35px rgba(58,226,129,.22);font-size:14px;font-weight:800;transition:transform .2s,box-shadow .2s; }
      .submit:hover { transform:translateY(-2px);box-shadow:0 18px 42px rgba(58,226,129,.33); }
      .submit span { margin-right:8px;font-size:17px;vertical-align:-1px; }
      .privacy { margin:12px 0 0;text-align:center;color:#7f899f;font-size:10px; }
      .map-card { margin-top:20px;overflow:hidden; }
      .map-head { display:flex;justify-content:space-between;gap:12px;padding:16px 20px;color:#dbe0ee;font-size:12px;font-weight:700; }
      .map-head span:last-child { color:var(--muted);font-weight:500; }
      .map { display:block;width:100%;height:195px;border:0;filter:grayscale(.86) contrast(1.12) brightness(.68); }
      footer { padding-top:27px;text-align:center;color:#788298;font:500 11px Inter,sans-serif; }
      .modal-backdrop { position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(2,5,11,.76);backdrop-filter:blur(14px); }
      .modal { width:min(565px,100%);max-height:min(760px,calc(100vh - 40px));overflow:auto;border:1px solid rgba(162,139,255,.35);border-radius:24px;background:#111a2c;box-shadow:0 28px 90px rgba(0,0,0,.55); }
      .modal-top { padding:27px 27px 22px;background:linear-gradient(135deg,rgba(138,104,255,.32),rgba(74,50,174,.2)); }
      .modal-top .modal-icon { display:grid;place-items:center;width:42px;height:42px;margin-bottom:14px;border-radius:13px;background:rgba(255,255,255,.14);font-size:19px; }
      .modal h2 { margin:0;font-size:22px;letter-spacing:-.7px; }
      .modal-top p { margin:9px 0 0;color:#d2ceee;font-size:12px;line-height:1.65; }
      .responsibilities { padding:8px 27px 18px; }
      .responsibility { display:flex;gap:12px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.07); }
      .responsibility:last-child { border-bottom:0; }
      .responsibility .icon { display:grid;place-items:center;flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:rgba(89,242,154,.1);font-size:15px; }
      .responsibility b { display:block;font-size:13px; }
      .responsibility p { margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.52; }
      .modal-bottom { padding:18px 27px 26px;border-top:1px solid rgba(255,255,255,.08); }
      .agree { display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;color:#c7cedd;font-size:12px;line-height:1.45;cursor:pointer; }
      .agree input { accent-color:var(--green);margin:2px 0 0; }
      .actions { display:grid;grid-template-columns:.65fr 1.35fr;gap:9px; }
      .cancel,.send { min-height:48px;border-radius:12px;font-weight:800;font-size:12px; }
      .cancel { color:#d5daea;border:1px solid var(--line);background:rgba(255,255,255,.05); }
      .send { border:0;color:#062714;background:var(--green); }
      .send:disabled { cursor:not-allowed;opacity:.42; }
      @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(89,242,154,0); } 100% { box-shadow:0 0 0 0 rgba(89,242,154,0); } }
      @media (max-width:820px) { .topbar{margin-bottom:39px}.hero,.main-grid{grid-template-columns:1fr}.hero{gap:23px}.hero-stats{max-width:520px}.main-grid{max-width:650px;margin:auto}.job-card{order:2}.form-card{order:1} }
      @media (max-width:520px) { .shell{padding:16px 14px 42px}.brand{font-size:13px}.open-badge{padding:8px 10px;font-size:10px}.topbar{margin-bottom:38px}h1{font-size:40px;letter-spacing:-2.1px}.hero-copy{font-size:14px;margin-top:16px}.hero-stats{gap:7px}.stat{min-height:99px;padding:15px}.stat b{font-size:15px}.stat span{font-size:10px}.card{border-radius:20px}.job-visual{min-height:188px}.job-content,.form-card{padding:21px 18px}.form-grid{grid-template-columns:1fr;gap:0}.languages{gap:6px}.modal-top,.responsibilities,.modal-bottom{padding-left:20px;padding-right:20px}.actions{grid-template-columns:1fr}.map{height:170px} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useState } = React;

      const duties = [
        ['👋', 'მომხმარებლების მომსახურება', 'სტუმრების მიღება, თავისუფალი კომპიუტერების გამოყოფა და წარმოქმნილი პრობლემების მოგვარება.'],
        ['🖥️', 'სისტემური მართვა', 'მომხმარებლების დროის აღრიცხვა, მართვა და კომპიუტერული სესიების გააქტიურება/გათიშვა მარტივი პროგრამით.'],
        ['🎮', 'თამაშების განახლება', 'თამაშების რეგულარული განახლება და მეთვალყურეობა Steam, Epic Games Launcher და სხვა პლატფორმების მეშვეობით.'],
        ['💰', 'სალარო და ფინანსები', 'გადახდების მიღება და სალაროს აპარატთან მუშაობა.'],
        ['🔧', 'ტექნიკური მხარდაჭერა', 'მარტივი ტექნიკური ხარვეზების აღმოფხვრა (კომპიუტერის გადატვირთვა, ინტერნეტის ან პერიფერიული მოწყობილობების შემოწმება) და სერიოზული პრობლემების ტექნიკურ მენეჯერთან გადამისამართება.'],
        ['🧹', 'წესრიგი და სისუფთავე', 'სამუშაო მაგიდების, კლავიატურების, მაუსებისა და ყურსასმენების სისუფთავის შენარჩუნება, დარბაზში სიმშვიდისა და წესების დაცვა.']
      ];

      function Modal({ onClose, onSend }) {
        const [agreed, setAgreed] = useState(false);
        useEffect(() => { const handler = e => e.key === 'Escape' && onClose(); document.addEventListener('keydown', handler); return () => document.removeEventListener('keydown', handler); }, [onClose]);
        return <div className="modal-backdrop" onMouseDown={e => e.target === e.currentTarget && onClose()} role="presentation">
          <section className="modal" role="dialog" aria-modal="true" aria-labelledby="responsibilities-title">
            <div className="modal-top"><div className="modal-icon">📋</div><h2 id="responsibilities-title">ძირითადი მოვალეობები</h2><p>ინტერნეტ კაფის ადმინისტრატორის ძირითადი მოვალეობები მოიცავს მომხმარებლებთან ურთიერთობას, კომპიუტერული სისტემების მეთვალყურეობას, სალაროს მართვასა და წესრიგის დაცვას.</p></div>
            <div className="responsibilities">{duties.map(([icon,title,text]) => <article className="responsibility" key={title}><div className="icon">{icon}</div><div><b>{title}</b><p>{text}</p></div></article>)}<article className="responsibility"><div className="icon">📚</div><div><b>სწავლება/სტაჟირება:</b><p>ადგილზე გათვალისწინებულია 1-კვირიანი შესწავლისა და მომზადების პერიოდი, სადაც დეტალურად გასწავლიან ყველა აღნიშნულ პროცესს.</p></div></article></div>
            <div className="modal-bottom"><label className="agree"><input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} />ვადასტურებ, რომ გავეცანი მოვალეობებს და ვეთანხმები</label><div className="actions"><button className="cancel" onClick={onClose}>გაუქმება</button><button className="send" disabled={!agreed} onClick={onSend}>გაგზავნა</button></div></div>
          </section>
        </div>;
      }

      function App() {
        const [data, setData] = useState({ name:'', age:'', languages:[], otherLanguage:'', windows:'საბაზისო დონე', playstation:'დიახ', serviceExp:'დიახ', shiftsAccepted:'დიახ, მისაღებია' });
        const [errors, setErrors] = useState({});
        const [modal, setModal] = useState(false);
        const update = (key, value) => { setData(old => ({...old, [key]:value})); setErrors(old => ({...old, [key]:false})); };
        const toggleLanguage = language => setData(old => ({...old, languages:old.languages.includes(language) ? old.languages.filter(item => item !== language) : [...old.languages, language]}));
        const begin = () => { const next = { name:!data.name.trim(), age:!data.age || Number(data.age) < 16 }; setErrors(next); if (!next.name && !next.age) setModal(true); };
        const send = () => { const languages = [...data.languages, data.otherLanguage.trim()].filter(Boolean).join(', ') || 'არ არის მითითებული'; const message = `*ახალი განაცხადი — Game Lounge Dinamo* 🎮\n\n*პოზიცია:* გეიმინგ ადმინისტრატორი\n\n*სახელი:* ${data.name.trim()}\n*ასაკი:* ${data.age}\n*ენები:* ${languages}\n*Windows:* ${data.windows}\n*PlayStation:* ${data.playstation}\n*მომსახურების გამოცდილება:* ${data.serviceExp}\n*გრაფიკი მისაღებია:* ${data.shiftsAccepted}\n\n📍 Game Lounge Dinamo`; window.location.href = `https://wa.me/995555554343?text=${encodeURIComponent(message)}`; };
        const field = (label, key, props={}) => <div className="field-group"><label className="field-label">{label}</label><input className={`input ${errors[key] ? 'invalid' : ''}`} value={data[key]} onChange={e => update(key,e.target.value)} {...props} />{errors[key] && <small style={{color:'#ff9aac',display:'block',marginTop:'6px',fontSize:'10px'}}>გთხოვ, შეავსე ეს ველი.</small>}</div>;
        return <div className="app"><main className="shell">
          <header className="topbar"><div className="brand"><div className="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 42"><path d="M17.4 4.2C9.1 4.2 4.8 10.4 2.9 19.6.7 30.5 5.1 37.8 10.7 37.8c4.4 0 7.2-5.2 10.1-8.8h22.4c2.9 3.6 5.7 8.8 10.1 8.8 5.6 0 10-7.3 7.8-18.2C59.2 10.4 54.9 4.2 46.6 4.2c-5.8 0-9.7 3.4-14.6 3.4s-8.8-3.4-14.6-3.4Z" /></svg></div>GAME LOUNGE DINAMO</div><div className="open-badge"><span className="pulse" />ვაკანსია ღიაა: გეიმინგ ადმინისტრატორი</div></header>

          <div className="main-grid"><div><section className="card job-card"><div className="job-visual"><div className="job-label">გეიმინგ ადმინისტრატორი</div><div className="visual-gamepad">🎮</div><h2>სამუშაო პირობები</h2></div><div className="job-content"><div className="section-title"><h3>სამუშაო პირობები (გეიმინგ ადმინისტრატორი)</h3><button onClick={() => document.getElementById('application').scrollIntoView({behavior:'smooth'})}>განაცხადის შევსება</button></div><div className="detail-list"><div className="detail"><i>✓</i><div><strong>ანაზღაურება:</strong><span>60 ₾ ცვლაში</span></div></div><div className="detail"><i>✓</i><div><strong>ცვლები:</strong><span>12:00–20:00 ან 20:00–04:00</span></div></div><div className="detail"><i>✓</i><div><strong>გრაფიკი:</strong><span>2 დღე / 1 დღე დასვენება</span></div></div><div className="detail"><i>✓</i><div><strong>ბონუსები:</strong><span>მოქმედებს საბონუსე სისტემა</span></div></div><div className="detail"><i>✓</i><div><strong>ფასდაკლება:</strong><span>შენთვის 50%, მეგობრებისთვის 30%</span></div></div></div><div className="location"><small>📍 ჩვენი მისამართი</small><p>დავით ყიფიანის 2</p></div></div></section><section className="card map-card"><div className="map-head"><span>📍 ჩვენი მისამართი</span><span>დავით ყიფიანის 2</span></div><iframe className="map" title="Game Lounge Dinamo map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2977.812736147858!2d44.78311817660697!3d41.72455957501265!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x404473716bd268d5%3A0x8c190995c370043c!2sGame%20Lounge%20Dinamo!5e0!3m2!1sen!2sge!4v1787840827285!5m2!1sen!2sge" loading="lazy" allowFullScreen referrerPolicy="strict-origin-when-cross-origin" /></section></div>
          <section id="application" className="card form-card"><h2>განაცხადის შევსება</h2><p>შეავსე ინფორმაცია — სულ რამდენიმე წუთი დაგჭირდება.</p><div className="form-grid">{field('სახელი და გვარი', 'name', {type:'text', placeholder:'მაგ: გიორგი ბერიძე', autoComplete:'name'})}{field('ასაკი', 'age', {type:'number', min:'16', max:'99', placeholder:'მიუთითეთ ასაკი'})}<div className="field-group full"><label className="field-label">რომელ ენებს ფლობთ?</label><div className="languages">{['ქართული','ინგლისური','რუსული'].map(language => <label className="language" key={language}><input type="checkbox" checked={data.languages.includes(language)} onChange={() => toggleLanguage(language)} />{language}</label>)}</div></div><div className="field-group full"><label className="field-label">სხვა ენა</label><input className="input" value={data.otherLanguage} onChange={e => update('otherLanguage', e.target.value)} placeholder="მაგ: გერმანული, თურქული..." /></div><div className="field-group"><label className="field-label">რამდენად კარგად ფლობთ Windows-ს?</label><select value={data.windows} onChange={e => update('windows',e.target.value)}><option>საბაზისო დონე</option><option>საშუალო დონე</option><option>მაღალი / პროფესიონალური</option></select></div><div className="field-group"><label className="field-label">გქონიათ შეხება PlayStation-თან?</label><select value={data.playstation} onChange={e => update('playstation',e.target.value)}><option>დიახ</option><option>არა</option></select></div><div className="field-group"><label className="field-label">გიმუშავიათ მომსახურების სფეროში?</label><select value={data.serviceExp} onChange={e => update('serviceExp',e.target.value)}><option>დიახ</option><option>არა</option></select></div><div className="field-group"><label className="field-label">მისაღებია თქვენთვის სამუშაო დროები?</label><select value={data.shiftsAccepted} onChange={e => update('shiftsAccepted',e.target.value)}><option>დიახ, მისაღებია</option><option>არა</option></select></div></div><div className="form-note"><span>⚡</span><div>სამუშაო პირობები (გეიმინგ ადმინისტრატორი)</div></div><button className="submit" onClick={begin}><span>◉</span>გაგზავნა WhatsApp-ში</button><p className="privacy">განაცხადი გაიგზავნება პირდაპირ WhatsApp-ზე 🔒</p></section></div>
          <footer>Game Lounge Dinamo © 2026</footer>
        </main>{modal && <Modal onClose={() => setModal(false)} onSend={send} />}</div>;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
